<script>

const CAT_DEPENSE = [
  { nom: "Nourriture", emoji: "🍚", compte: "601" },
  { nom: "Transport", emoji: "🚌", compte: "626" },
  { nom: "Loyer", emoji: "🏠", compte: "613" },

];

];

let COMPTES = [], ECRITURES = [], PROJETS = [], BUDGETS = [], HISTORIQUE = [], ECHEANCES = [], DETTES = [];

function fmt(n) { return Number(n || 0).toLocaleString('fr-FR').replace(/\u202f/g, ' ') + ' F'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let _loader = 0;
function showLoader(t) { _loader++; document.getElementById('loaderText').textContent = t || 'Chargement...'; document.getElementById('loaderOverlay').classList.add('show'); }
function hideLoader() { _loader = Math.max(0, _loader - 1); if (_loader === 0) document.getElementById('loaderOverlay').classList.remove('show'); }
async function withLoader(t, fn) { showLoader(t); try { await fn(); } catch (e) { toast(e.message, true); } finally { hideLoader(); } }

let _toastT = null;
function toast(msg, isErr = false, undo = null) {
  const t = document.getElementById('toast');
  if (undo) {
    t.innerHTML = `${msg} <button class="toast-undo" id="toastUndo">Annuler</button>`;
    document.getElementById('toastUndo').onclick = () => { clearTimeout(_toastT); t.className = 'toast'; t.innerHTML = ''; undo(); };
  } else { t.textContent = msg; }
  t.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => { t.className = 'toast'; t.innerHTML = ''; }, undo ? 5000 : 3000);
}

async function apiGet(path) { const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function apiPost(path, body) { const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(body) }); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function apiPatch(path, body) { const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if (!r.ok) throw new Error(await r.text()); }
async function apiDel(path) { const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }); if (!r.ok) throw new Error(await r.text()); }

async function loadAll() {
  showLoader('Chargement...');
  try {
    COMPTES = await apiGet('comptes?select=*&order=numero');
    ECRITURES = await apiGet('ecritures?select=*&order=date.desc,id.desc');

    BUDGETS = await apiGet(`budgets_mensuels?select=*&mois=eq.${moisCourant}`);
    HISTORIQUE = await apiGet('historique_mensuel?select=*&order=mois.desc&limit=12');
    ECHEANCES = await apiGet('echeances?select=*&fait=eq.false&order=date');
    DETTES = await apiGet('dettes?select=*&order=id');

    document.getElementById('app').classList.remove('hidden');
    renderAll();
  } catch (e) { document.getElementById('loading').innerHTML = '❌ ' + e.message; }

}

async function refreshBudgets() { await withLoader('Mise à jour...', async () => { BUDGETS = await apiGet(`budgets_mensuels?select=*&mois=eq.${moisCourant}`); renderBudgets(); updateKPIs(); }); }
async function refreshEcheances() { await withLoader('Mise à jour...', async () => { ECHEANCES = await apiGet('echeances?select=*&fait=eq.false&order=date'); renderEcheances(); }); }
async function refreshDettes() { await withLoader('Mise à jour...', async () => { DETTES = await apiGet('dettes?select=*&order=id'); renderDettes(); updateKPIs(); }); }

function solde(num) {
  let s = 0;
  ECRITURES.forEach(e => { if (e.compte_debit === num) s += Number(e.montant); if (e.compte_credit === num) s -= Number(e.montant); });
  const c = COMPTES.find(x => x.numero === num);
  if (c && (c.type === 'passif' || c.type === 'produit')) s = -s;
  return s;
}
function ecrituresMois(mois) { return ECRITURES.filter(e => e.mois === mois); }
function totalMois(mois, type) {
  let t = 0;
  ecrituresMois(mois).forEach(e => {
    const dc = COMPTES.find(c => c.numero === e.compte_debit);
    const cc = COMPTES.find(c => c.numero === e.compte_credit);
    if (dc && dc.type === type) t += Number(e.montant);
    if (cc && cc.type === type) t -= Number(e.montant);
  });
  return Math.abs(t);
}
function epargneProjet(p) { return ECRITURES.filter(e => e.projet_id == p.id).reduce((s, e) => s + Number(e.montant), 0); }
function epargneProjetMois(p, mois) { return ECRITURES.filter(e => e.projet_id == p.id && e.mois === mois).reduce((s, e) => s + Number(e.montant), 0); }
function revenusMois(mois) { return ecrituresMois(mois).filter(e => { const cc = COMPTES.find(c => c.numero === e.compte_credit); return cc && cc.type === 'produit'; }); }
function depensesImputees(rid) { return ECRITURES.filter(e => e.revenu_source_id == rid).reduce((s, e) => s + Number(e.montant), 0); }
function budgetsReserves(rid) { return BUDGETS.filter(b => b.revenu_source_id == rid).reduce((s, b) => s + Number(b.montant_prevu) + Number(b.report_precedent || 0), 0); }
function budgetPaye(bid) {
  const b = BUDGETS.find(x => x.id === bid);
  if (!b) return 0;
  return ecrituresMois(moisCourant).filter(e => {
    if (e.type_operation !== 'depense') return false;
    const dc = COMPTES.find(c => c.numero === e.compte_debit);
    return dc && dc.libelle.toLowerCase().includes(b.categorie.toLowerCase());
  }).reduce((s, e) => s + Number(e.montant), 0);
}

function updateKPIs() {
  const dispo = solde(COMPTE_BANQUE) + solde("530");
  const rev = totalMois(moisCourant, 'produit');
  const dep = totalMois(moisCourant, 'charge');
  const benef = rev - dep;
  const ep = PROJETS.reduce((s, p) => s + epargneProjet(p), 0);
  document.getElementById('soldeDispo').textContent = fmt(dispo);
  document.getElementById('revenusMois').textContent = fmt(rev);
  document.getElementById('depensesMois').textContent = fmt(dep);
  document.getElementById('kpiBenefice').textContent = fmt(benef);
  document.getElementById('kpiBenefice').className = 'kpi-value ' + (benef >= 0 ? 'kpi-pos' : 'kpi-neg');
  document.getElementById('kpiEpargne').textContent = fmt(ep);
  const alertes = [];
  if (dispo < 0) alertes.push(`<div class="alert alert-danger">⚠️ Solde négatif : ${fmt(dispo)}</div>`);
  document.getElementById('alertZone').innerHTML = alertes.join('');
}

function renderHistorique() {
  const div = document.getElementById('histoChart');
  const derniers = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(moisCourant + '-15'); d.setMonth(d.getMonth() - i);
    const m = d.toISOString().slice(0, 7);
    derniers.push({ mois: m, rev: totalMois(m, 'produit'), dep: totalMois(m, 'charge') });
  }
  const max = Math.max(...derniers.map(d => Math.max(d.rev, d.dep)), 1);
  div.innerHTML = '<div class="histo-bar">' + derniers.map(d => `<div class="histo-col"><div class="bar-rev" style="height:${(d.rev / max) * 100}%"></div><div class="bar-dep" style="height:${(d.dep / max) * 100}%"></div><div class="bar-label">${d.mois.slice(5)}</div></div>`).join('') + '</div>';
  const clot = document.getElementById('cloturesList');
  if (!HISTORIQUE.length) { clot.innerHTML = '<div class="empty">Aucune clôture</div>'; return; }

function revenusDispos() {
  return revenusMois(moisCourant).filter(r => {
    const reste = Number(r.montant) - depensesImputees(r.id) - budgetsReserves(r.id);
    return reste > 0;
  });
}

function optionsRevenus() {
  const revs = revenusDispos();
  if (!revs.length) return { html: '<div class="alert alert-warn">Aucun revenu disponible.</div>', vide: true };
  return {
    html: revs.map(r => {
      const reste = Number(r.montant) - depensesImputees(r.id) - budgetsReserves(r.id);
      return `<option value="${r.id}">${esc(r.libelle)} (reste ${fmt(reste)})</option>`;
    }).join(''),
    vide: false
  };
}

    content = `<div class="form-group"><label>Libellé</label><input type="text" id="mDetail" value="${esc(e.libelle)}"></div>

    title = '✏️ Modifier';
    content = `<div class="form-group"><label>Type</label><select id="dType"><option value="dette" ${d.type==='dette'?'selected':''}>Dette</option><option value="creance" ${d.type==='creance'?'selected':''}>Créance</option></select></div>

      <div class="form-group"><label>Montant</label><input type="number" id="dMontant" value="${d.montant}"></div>
      <div class="form-group"><label>Date d'échéance</label><input type="date" id="dEcheance" value="${d.date_echeance || ''}"></div>
      <button class="btn-submit" onclick="submitEditDette(${id})">💾</button>`;
  } else if (type === 'rembourser') {
    const d = DETTES.find(x => x.id == id);
    title = (d.type === 'dette' ? '💳 Rembourser ' : '📥 Encaisser ') + esc(d.nom);

async function cloturerMois(mois) {
  if (!confirm(`Clôturer ${mois} ?\nLes restes non payés seront reportés sur le mois suivant.`)) return;
  await withLoader('Clôture...', async () => {
    const ecM = ECRITURES.filter(e => e.mois === mois);
    if (!ecM.length) { toast('Aucune écriture', true); return; }
    const rev = totalMois(mois, 'produit');
    const dep = totalMois(mois, 'charge');
    const moisSuiv = (() => { const d = new Date(mois + '-15'); d.setMonth(d.getMonth() + 1); return d.toISOString().slice(0, 7); })();
    for (const b of BUDGETS) {
      const paye = budgetPaye(b.id);
      const du = Number(b.montant_prevu) + Number(b.report_precedent || 0);
      const reste = du - paye;
      if (reste > 0) {
        const existing = await apiGet(`budgets_mensuels?mois=eq.${moisSuiv}&categorie=eq.${encodeURIComponent(b.categorie)}`);
        if (existing.length) await apiPatch(`budgets_mensuels?id=eq.${existing[0].id}`, { report_precedent: Number(existing[0].report_precedent || 0) + reste });
        else await apiPost('budgets_mensuels', { mois: moisSuiv, categorie: b.categorie, montant_prevu: b.montant_prevu, report_precedent: reste, revenu_source_id: b.revenu_source_id });
      }
    }
    for (const p of PROJETS) {
      const prev = Number(p.epargne_mensuelle_prevue) || 0;
      if (prev > 0) {
        const reel = epargneProjetMois(p, mois);
        const reste = Math.max(0, prev - reel);
        if (reste > 0) await apiPatch(`projets?id=eq.${p.id}`, { report_mois_precedent: reste });
      }
    }
    await apiPost('historique_mensuel', { mois, total_produits: rev, total_charges: dep, resultat: rev - dep, solde_banque: solde('512'), solde_caisse: solde('530'), patrimoine: 0, epargne_cumulee: PROJETS.reduce((s, p) => s + epargneProjet(p), 0) });
    await apiPatch(`ecritures?mois=eq.${mois}`, { cloture: true });
    toast('📦 Clôturé + reports appliqués'); notify('📦 Clôturé', mois + ' : ' + fmt(rev - dep));
    await loadAll();
  });
}

// ============ EXPORT PDF ============
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 15;

  doc.setFontSize(20);
  doc.setTextColor(30, 64, 175);
  doc.text('Rick Finance', pageWidth / 2, y, { align: 'center' });
  y += 8;
  doc.setFontSize(14);
  doc.setTextColor(100, 100, 100);
  const moisLabel = new Date(moisCourant + '-15').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  doc.text('Rapport financier — ' + moisLabel, pageWidth / 2, y, { align: 'center' });
  y += 4;
  doc.setFontSize(9);
  doc.text('Généré le ' + new Date().toLocaleString('fr-FR'), pageWidth / 2, y, { align: 'center' });
  y += 10;

  const dispo = solde(COMPTE_BANQUE) + solde("530");
  const rev = totalMois(moisCourant, 'produit');
  const dep = totalMois(moisCourant, 'charge');
  const benefice = rev - dep;
  const epargneTotale = PROJETS.reduce((s, p) => s + epargneProjet(p), 0);
  const dettesRestantes = DETTES.filter(d => d.type === 'dette').reduce((s, d) => s + Number(d.montant_restant), 0);

  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  doc.text('RESUME', 14, y);
  y += 2;
  doc.autoTable({
    startY: y,
    head: [['Indicateur', 'Montant']],
    body: [
      ['Argent disponible', fmt(dispo)],
      ['Revenus du mois', fmt(rev)],
      ['Depenses du mois', fmt(dep)],
      ['Benefice du mois', fmt(benefice)],
      ['Epargne totale', fmt(epargneTotale)],
      ['Dettes restantes', fmt(dettesRestantes)]
    ],
    theme: 'grid',
    headStyles: { fillColor: [30, 64, 175], fontSize: 10 },
    bodyStyles: { fontSize: 9 },
    columnStyles: { 1: { halign: 'right' } }
  });
  y = doc.lastAutoTable.finalY + 8;

  const revs = revenusMois(moisCourant);
  if (revs.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('REVENUS DU MOIS', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Libelle', 'Date', 'Montant', 'Reste disponible']],
      body: revs.map(r => {
        const impute = depensesImputees(r.id);
        const reserve = budgetsReserves(r.id);
        const reste = Number(r.montant) - impute - reserve;
        return [r.libelle, r.date, fmt(r.montant), fmt(reste)];
      }),
      theme: 'grid',
      headStyles: { fillColor: [16, 185, 129], fontSize: 10 },
      bodyStyles: { fontSize: 9 }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  const deps = ecrituresMois(moisCourant).filter(e => e.type_operation === 'depense');
  if (deps.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('DEPENSES DU MOIS', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Libelle', 'Date', 'Categorie', 'Montant']],
      body: deps.map(e => {
        const dc = COMPTES.find(c => c.numero === e.compte_debit);
        return [e.libelle, e.date, dc ? dc.libelle : '-', fmt(e.montant)];
      }),
      theme: 'grid',
      headStyles: { fillColor: [220, 38, 38], fontSize: 10 },
      bodyStyles: { fontSize: 9 },
      columnStyles: { 3: { halign: 'right' } }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  if (PROJETS.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('PROJETS', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Priorite', 'Nom', 'Type', 'Epargne', 'Objectif', 'Avancement', 'Prevision/mois']],
      body: PROJETS.map(p => {
        const ep = epargneProjet(p);
        const pct = p.objectif > 0 ? ((ep / p.objectif) * 100).toFixed(0) + '%' : '0%';
        return [
          p.priorite || 1,
          p.nom,
          p.type === 'investissement' ? 'Investissement' : 'Epargne',
          fmt(ep),
          fmt(p.objectif),
          pct,
          p.epargne_mensuelle_prevue > 0 ? fmt(p.epargne_mensuelle_prevue) : '-'
        ];
      }),
      theme: 'grid',
      headStyles: { fillColor: [59, 130, 246], fontSize: 9 },
      bodyStyles: { fontSize: 8 }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  if (BUDGETS.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('BUDGETS DU MOIS', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Categorie', 'Prevu', 'Report', 'Total du', 'Paye', 'Reste']],
      body: BUDGETS.map(b => {
        const paye = budgetPaye(b.id);
        const du = Number(b.montant_prevu) + Number(b.report_precedent || 0);
        const reste = du - paye;
        return [b.categorie, fmt(b.montant_prevu), fmt(b.report_precedent || 0), fmt(du), fmt(paye), fmt(reste)];
      }),
      theme: 'grid',
      headStyles: { fillColor: [139, 92, 246], fontSize: 10 },
      bodyStyles: { fontSize: 9 }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  if (ECHEANCES.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('ECHEANCES', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Libelle', 'Date', 'Montant', 'Deja paye', 'Reste']],
      body: ECHEANCES.map(e => {
        const paye = Number(e.montant_paye) || 0;
        return [e.libelle, e.date, fmt(e.montant), fmt(paye), fmt(e.montant - paye)];
      }),
      theme: 'grid',
      headStyles: { fillColor: [245, 158, 11], fontSize: 10 },
      bodyStyles: { fontSize: 9 }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  if (DETTES.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('DETTES & CREANCES', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Type', 'Nom', 'Montant total', 'Restant', 'Echeance']],
      body: DETTES.map(d => [
        d.type === 'dette' ? 'Dette' : 'Creance',
        d.nom,
        fmt(d.montant),
        fmt(d.montant_restant),
        d.date_echeance || '-'
      ]),
      theme: 'grid',
      headStyles: { fillColor: [220, 38, 38], fontSize: 10 },
      bodyStyles: { fontSize: 9 }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  if (HISTORIQUE.length) {
    if (y > 240) { doc.addPage(); y = 15; }
    doc.setFontSize(12);
    doc.text('HISTORIQUE MENSUEL', 14, y);
    y += 2;
    doc.autoTable({
      startY: y,
      head: [['Mois', 'Revenus', 'Depenses', 'Benefice', 'Solde banque', 'Solde caisse']],
      body: HISTORIQUE.map(h => [
        h.mois,
        fmt(h.total_produits),
        fmt(h.total_charges),
        fmt(h.resultat),
        fmt(h.solde_banque),
        fmt(h.solde_caisse)
      ]),
      theme: 'grid',
      headStyles: { fillColor: [30, 64, 175], fontSize: 9 },
      bodyStyles: { fontSize: 8 }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150, 150, 150);
    doc.text('Rick Finance — Page ' + i + '/' + pageCount, pageWidth / 2, 290, { align: 'center' });
  }

  doc.save(`rick-finance-rapport-${moisCourant}.pdf`);
  toast('📄 PDF généré');
}

async function importJSON(event) {
  const file = event.target.files[0]; if (!file) return;
  await withLoader('Import...', async () => {
    const data = JSON.parse(await file.text());
    let c = 0;
    if (data.ecritures?.length) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/ecritures`, { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(data.ecritures.map(e => ({ date: e.date, libelle: e.libelle, montant: e.montant, compte_debit: e.compte_debit, compte_credit: e.compte_credit, mois: e.mois, type_operation: e.type_operation || 'depense' }))) });
      if (r.ok) c += data.ecritures.length;
    }
    toast(`📤 ${c} importés`); await loadAll();
  });
  event.target.value = '';
}
</script>
</body>
</html>
